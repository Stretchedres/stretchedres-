name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each entry matches versions/<name>.properties
        mc: ['1.19.2', '1.20.1', '1.21.1', '1.21.4']
    env:
      MC: ${{ matrix.mc }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find the newest Fabric API for this Minecraft version
        id: api
        run: |
          v=$(curl -fsS -A "stretchedres-ci" -G "https://api.modrinth.com/v2/project/fabric-api/version" \
                --data-urlencode "game_versions=[\"$MC\"]" \
                --data-urlencode 'loaders=["fabric"]' \
                | jq -r '.[0].version_number // empty' || true)
          echo "Fabric API: ${v:-<fallback from versions file>}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          API: ${{ steps.api.outputs.version }}
        run: |
          args=(build "-Pmc=$MC" --no-daemon)
          if [ -n "$API" ]; then args+=("-Pfabric_api_override=$API"); fi
          gradle "${args[@]}"

      - name: Collect jar with a stable file name
        run: |
          tag=$(grep '^archive_tag=' "versions/$MC.properties" | cut -d= -f2)
          mkdir -p dist
          jar=$(ls build/libs/stretchedres-*.jar | grep -v -e '-sources' -e '-dev' | head -n1)
          cp "$jar" "dist/stretchedres-$tag.jar"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.mc }}
          path: dist/*.jar

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
